name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: read
  pull-requests: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

    - name: Decode debug keystore
      shell: bash
      run: |
        echo "${DEBUG_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/debug.keystore"
        echo "DEBUG_KEYSTORE_PATH=${RUNNER_TEMP}/debug.keystore" >> "$GITHUB_ENV"

    - name: Build with Gradle
      env:
        DEBUG_KEYSTORE_PATH: ${{ env.DEBUG_KEYSTORE_PATH }}
      run: ./gradlew assembleDebug

    - name: Rename APK with branch and short hash
      if: github.event_name == 'pull_request'
      env:
        BRANCH_NAME: ${{ github.head_ref }}
        REPOSITORY: ${{ github.repository }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        SHORT_SHA="${HEAD_SHA:0:7}"
        SAFE_REPO="${REPOSITORY##*/}"
        SAFE_BRANCH="${BRANCH_NAME//\//-}"
        APK_NAME="app-${SAFE_REPO}-${SAFE_BRANCH}-${SHORT_SHA}.apk"
        mv app/build/outputs/apk/debug/app-debug.apk \
          "app/build/outputs/apk/debug/${APK_NAME}"
        echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"
        echo "APK_PATH=app/build/outputs/apk/debug/${APK_NAME}" >> "$GITHUB_ENV"

    - name: Upload APK
      id: upload_apk
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ env.APK_NAME || 'debug-apk' }}
        path: ${{ env.APK_PATH || 'app/build/outputs/apk/debug/*.apk' }}

    - name: Compress APK for S3 upload
      if: github.event_name == 'pull_request'
      run: |
        zstd -18 --long=27 -T0 -q -c "${APK_PATH}" > "${APK_PATH}.zst"
        echo "S3_APK_PATH=${APK_PATH}.zst" >> "$GITHUB_ENV"

    - name: Upload APK to S3
      if: github.event_name == 'pull_request'
      id: upload_s3
      uses: matsudamper/actions/upload-matsudamper-s3@a1ecf81b1a0ce320824a49711e456f396e4e8fea
      continue-on-error: true
      with:
        file_path: ${{ env.S3_APK_PATH }}

    - name: Upload GitHub QR code
      if: github.event_name == 'pull_request'
      id: github_qr_artifact
      uses: matsudamper/actions/upload-qr-code@7577a0a7bddd81843525c1f8539b119bdaa7825c # v1.1.0
      with:
        url: ${{ steps.upload_apk.outputs.artifact-url }}
        output_path: qrcode-github.png
        artifact_name: apk-qr-code-github

    - name: Upload S3 QR code
      if: github.event_name == 'pull_request' && steps.upload_s3.outputs.url != ''
      id: s3_qr_artifact
      uses: matsudamper/actions/upload-qr-code@7577a0a7bddd81843525c1f8539b119bdaa7825c # v1.1.0
      with:
        url: ${{ steps.upload_s3.outputs.url }}
        output_path: qrcode-s3.png
        artifact_name: apk-qr-code-s3

    - name: Comment APK download URLs
      if: github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: apk-download
        recreate: true
        message: |
          ✅ **Debug APK is ready!**

          | Storage | 圧縮方式 | Download Link | QR Code |
          | :--- | :--- | :--- | :--- |
          | 🐙 GitHub Artifacts | zstd | [Download](${{ steps.upload_apk.outputs.artifact-url }}) | [View](${{ steps.github_qr_artifact.outputs.artifact-url }}) |
          ${{ steps.upload_s3.outputs.url && format('| ☁️ S3 | zstd | [Download]({0}) | [View]({1}) |', steps.upload_s3.outputs.url, steps.s3_qr_artifact.outputs.artifact-url) || format('| ☁️ S3 | - | ⚠️ アップロード失敗 ([run]({0}/{1}/actions/runs/{2})) | - |', github.server_url, github.repository, github.run_id) }}

          ---
          *Artifact Name: `${{ env.APK_NAME }}`*
          *Commit: [`${{ github.event.pull_request.head.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }})*
