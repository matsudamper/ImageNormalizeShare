name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: read
  pull-requests: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK 17
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

    - name: Decode debug keystore
      shell: bash
      run: |
        echo "${DEBUG_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/debug.keystore"
        echo "DEBUG_KEYSTORE_PATH=${RUNNER_TEMP}/debug.keystore" >> "$GITHUB_ENV"

    - name: Build with Gradle
      env:
        DEBUG_KEYSTORE_PATH: ${{ env.DEBUG_KEYSTORE_PATH }}
      run: ./gradlew assembleDebug

    - name: Rename APK with branch and short hash
      if: github.event_name == 'pull_request'
      env:
        BRANCH_NAME: ${{ github.head_ref }}
        REPOSITORY: ${{ github.repository }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        SHORT_SHA="${HEAD_SHA:0:7}"
        SAFE_REPO="${REPOSITORY##*/}"
        SAFE_BRANCH="${BRANCH_NAME//\//-}"
        APK_NAME="app-${SAFE_REPO}-${SAFE_BRANCH}-${SHORT_SHA}.apk"
        mv app/build/outputs/apk/debug/app-debug.apk \
          "app/build/outputs/apk/debug/${APK_NAME}"
        echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"
        echo "APK_PATH=app/build/outputs/apk/debug/${APK_NAME}" >> "$GITHUB_ENV"

    - name: Upload APK
      id: upload_apk
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ env.APK_NAME || 'debug-apk' }}
        path: ${{ env.APK_PATH || 'app/build/outputs/apk/debug/*.apk' }}

    - name: Compress APK for S3 upload
      if: github.event_name == 'pull_request'
      run: |
        xz -0 -c "${APK_PATH}" > "${APK_PATH}.xz"
        echo "S3_APK_PATH=${APK_PATH}.xz" >> "$GITHUB_ENV"

    - name: Upload APK to S3
      if: github.event_name == 'pull_request'
      id: upload_s3
      uses: matsudamper/actions/upload-matsudamper-s3@a1ecf81b1a0ce320824a49711e456f396e4e8fea
      continue-on-error: true
      with:
        file_path: ${{ env.S3_APK_PATH }}

    - name: Generate and upload GitHub QR code
      if: github.event_name == 'pull_request'
      run: |
        pip install "qrcode[pil]" --quiet
        python3 -c "import qrcode, sys; qrcode.make(sys.argv[1]).save('qrcode-github.png')" "${{ steps.upload_apk.outputs.artifact-url }}"

    - name: Upload GitHub QR artifact
      if: github.event_name == 'pull_request'
      id: github_qr_artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: apk-qr-code-github
        path: qrcode-github.png
        archive: false

    - name: Generate S3 QR code
      if: github.event_name == 'pull_request' && steps.upload_s3.outputs.url != ''
      run: python3 -c "import qrcode, sys; qrcode.make(sys.argv[1]).save('qrcode-s3.png')" "${{ steps.upload_s3.outputs.url }}"

    - name: Upload S3 QR artifact
      if: github.event_name == 'pull_request' && steps.upload_s3.outputs.url != ''
      id: s3_qr_artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: apk-qr-code-s3
        path: qrcode-s3.png
        archive: false

    - name: Comment APK download URLs
      if: github.event_name == 'pull_request'
      uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      with:
        header: apk-download
        recreate: true
        message: |
          ✅ **Debug APK is ready!**

          | Storage | 圧縮方式 | Download Link | QR Code |
          | :--- | :--- | :--- | :--- |
          | 🐙 GitHub Artifacts | zstd | [Download](${{ steps.upload_apk.outputs.artifact-url }}) | [View](${{ steps.github_qr_artifact.outputs.artifact-url }}) |
          ${{ steps.upload_s3.outputs.url && format('| ☁️ S3 | xz | [Download]({0}) | [View]({1}) |', steps.upload_s3.outputs.url, steps.s3_qr_artifact.outputs.artifact-url) || format('| ☁️ S3 | - | ⚠️ アップロード失敗 ([run]({0}/{1}/actions/runs/{2})) | - |', github.server_url, github.repository, github.run_id) }}

          ---
          *Artifact Name: `${{ env.APK_NAME }}`*
          *Commit: [`${{ github.event.pull_request.head.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }})*
